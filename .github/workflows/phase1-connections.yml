name: Phase 1 connection foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/phase1-local-connections]
permissions:
  contents: read
jobs:
  connections:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: phase1_ci_disposable
          POSTGRES_DB: candidate_profile_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-managed:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: phase1_ci_disposable
          POSTGRES_DB: candidate_profile_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PHASE1_DISPOSABLE_DATABASE_URL: postgresql://postgres:phase1_ci_disposable@127.0.0.1:5432/candidate_profile_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate
      - run: python -m pip install -r backend/requirements.txt ruff bandit
      - name: Offline contracts and security
        run: python -m pytest backend/tests/test_phase1_local_agent.py backend/tests/test_telegram_pairing.py backend/tests/test_phase1_installation.py backend/tests/test_phase1_conversation.py backend/tests/test_phase1_conversational_agent.py backend/tests/test_phase1_agy_diagnostics.py backend/tests/test_phase1_account_setup.py backend/tests/test_phase1_connection_acceptance.py -q
      - name: Extension build and event tests
        run: |
          node extension/build.mjs
          node --test extension/tests/*.test.mjs
      - name: Public migration and role restrictions on disposable PostgreSQL
        run: python backend/scripts/phase1/verify_public.py --bootstrap
      - name: Preserve pinned Supabase RLS event trigger and reject changed grants or definitions
        env:
          PHASE1_DISPOSABLE_DATABASE_URL: postgresql://postgres:phase1_ci_disposable@127.0.0.1:5433/candidate_profile_test
        run: python backend/scripts/phase1/verify_public.py --bootstrap --with-supabase-managed-function
      - name: Actual native framing, FastAPI, PostgreSQL and restart lifecycle
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend exec playwright install --with-deps chromium
          python backend/scripts/phase1/prepare_disposable.py
          python backend/scripts/phase1/lifecycle_smoke.py --env-file reports/phase1/disposable.private.env --with-chromium-extension
      - name: Gmail compose intent on real disposable PostgreSQL
        env:
          PHASE1_DISPOSABLE_DATABASE_URL: postgresql://postgres:phase1_ci_disposable@127.0.0.1:5433/candidate_profile_test
        run: python backend/scripts/phase1/verify_gmail_compose.py
      - name: Foundation lint and security scan
        run: |
          ruff check --isolated --select E9,F,I backend/app/local_agent backend/app/ai/providers/agy.py backend/scripts/phase1 backend/tests/test_phase1_local_agent.py backend/tests/test_telegram_pairing.py backend/tests/test_phase1_installation.py backend/tests/test_phase1_conversation.py backend/tests/test_phase1_agy_diagnostics.py backend/tests/test_phase1_account_setup.py
          bandit -q -r backend/app
