name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    # The full suite rebuilds isolated schemas and verifies migrations 001–011.
    # Keep a finite job limit with room for hosted-runner variance and Docker.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: profile_test_only
          POSTGRES_DB: candidate_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE_SCHEMA: job_agent
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      JOB_AGENT_API_TOKEN: ci-dummy-token-not-for-production
      PROFILE_TEST_DATABASE_URL: postgresql://postgres:profile_test_only@127.0.0.1:5432/candidate_profile_test
      HUNTER_API_KEY: ''
      APOLLO_API_KEY: ''
      SERPER_API_KEY: ''
      SIGNALHIRE_API_KEY: ''
      APIFY_API_TOKEN: ''
      GMAIL_SENDING_ENABLED: 'false'
      GMAIL_CLIENT_ID: ''
      GMAIL_CLIENT_SECRET: ''
      GMAIL_REFRESH_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install ruff bandit
      - name: Contact enrichment lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/contact_enrichment
          backend/app/api/v1/contact_enrichment.py
          backend/app/models/contact_enrichment.py
          backend/tests/test_contact* backend/tests/contact_enrichment_fakes.py
          backend/scripts/*contact* backend/scripts/verify_phase3_migration.py
      - name: Contact enrichment security scan
        run: >-
          bandit -q -r backend/app/services/contact_enrichment
          backend/app/api/v1/contact_enrichment.py
          backend/app/models/contact_enrichment.py
      - name: Phase 4A lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/mcp backend/app/integrations
          backend/app/services/outreach_drafting.py backend/app/services/saved_data.py
          backend/app/services/contact_read.py backend/app/api/v1/integrations.py
          backend/app/api/v1/outreach.py backend/app/models/connected_account.py
          backend/app/schemas/outreach.py backend/app/core/config.py backend/app/main.py
          backend/app/models/outreach.py backend/app/mcp_server.py
          backend/scripts/setup_gmail_oauth.py
          backend/tests/phase4a_fakes.py backend/tests/test_mcp_auth.py
          backend/tests/test_mcp_tool_permissions.py backend/tests/test_mcp_transport.py
          backend/tests/test_gmail_oauth.py backend/tests/test_gmail_token_store.py
          backend/tests/test_gmail_connection.py backend/tests/test_outreach*.py
          backend/tests/test_phase4a_postgres.py backend/scripts/verify_phase4a_migration.py
      - name: Phase 4B lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/gmail_sending.py backend/app/models/outreach_send.py
          backend/tests/phase4b_fakes.py backend/tests/test_gmail_send*.py
          backend/tests/test_gmail_mime.py backend/tests/test_phase4b_postgres.py
          backend/scripts/verify_phase4b_migration.py
      - name: Phase 7 lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/dashboard backend/scripts/export_openapi.py
          backend/scripts/phase7_ui_fixture.py backend/scripts/resolve_owner_resume.py
          backend/scripts/configure_frontend_owner.py backend/tests/test_phase7_dashboard.py
          backend/app/api/v1/discovery.py
      - name: Backend security scan
        run: bandit -q -r backend/app
      - name: Resume sync lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/resume_sync backend/scripts/sync_drive_resume.py
          backend/scripts/verify_resume_sync_migration.py
          backend/tests/test_resume_sync*.py backend/tests/test_resume_drive_download.py
      - name: Phase 5A lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/applications backend/app/api/v1/applications.py
          backend/app/schemas/applications.py backend/app/models/application_packet.py
          backend/app/repositories/application_packet.py
          backend/scripts/verify_phase5a_migration.py backend/scripts/demo_application_preparation.py
          backend/tests/phase5a_fakes.py backend/tests/test_application_packet*.py
          backend/tests/test_application_question_mapping.py backend/tests/test_application_resume_selection.py
          backend/tests/test_application_status_tracking.py backend/tests/test_naukri_application_capabilities.py
          backend/tests/test_application_handoff.py backend/tests/test_phase5a_postgres.py
      - name: Phase 6A lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/startup_discovery backend/app/api/v1/startups.py
          backend/app/models/startup.py backend/app/services/people_discovery
          backend/app/services/job_discovery_service.py backend/app/services/job_ingestion.py
          backend/app/repositories/company.py
          backend/app/services/job_sources/apify_adapter.py backend/app/services/job_sources/direct_api.py
          backend/app/services/job_sources/registry.py
          backend/tests/startup_fakes.py backend/tests/test_live_startup_discovery.py
          backend/tests/test_startup_intelligence.py backend/tests/test_provider_connectivity.py
          backend/tests/test_startup_people_bridge.py backend/tests/test_startup_api_mcp.py
          backend/tests/test_phase6a_postgres.py backend/scripts/verify_phase6a_migration.py
          backend/scripts/startup_discovery_demo.py
      - name: Offline startup demonstration
        run: python backend/scripts/startup_discovery_demo.py > /tmp/startup-offline.json
      - run: python -m compileall -q backend/app
      - name: Full backend regression suite
        # Bound the process group so a hung test/child cannot consume the whole job
        # or prevent final diagnostics from being uploaded. Every test still runs.
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=20s 6m python -u -m pytest backend/tests -v --durations=20 -o faulthandler_timeout=120 2>&1 | tee /tmp/backend-regression.log
      - name: Retain backend regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-${{ github.run_id }}
          path: /tmp/backend-regression.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Phase 6B operational lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/operations backend/app/core/config.py backend/app/core/logging.py
          backend/app/db/session.py backend/app/services/candidate_profile_service.py
          backend/app/db/safety.py backend/tests/test_database_safety.py
          backend/scripts/check_database.py
          backend/app/services/applications/platforms/public_listing.py
          backend/scripts/check_environment.py backend/scripts/migration_preflight.py
          backend/scripts/onboard_profile.py backend/scripts/run_startup_pilot.py
          backend/scripts/check_providers.py backend/scripts/smoke_test.py
          backend/scripts/check_workspace.py backend/scripts/local_public_pilot.py
          backend/scripts/public_source_smoke.py backend/scripts/validate_gemini.py
          backend/scripts/verify_phase6b_migration.py
          backend/tests/test_environment_readiness.py backend/tests/test_migration_preflight.py
          backend/tests/test_profile_onboarding_readiness.py backend/tests/test_operational_health.py
          backend/tests/test_startup_pilot_operations.py
          backend/tests/test_workspace_readiness.py backend/tests/test_local_public_pilot.py
          backend/tests/test_pilot_location_evidence.py
      - name: Phase 6B offline integrated smoke
        run: python backend/scripts/smoke_test.py --mode local-offline --output /tmp/phase6b-offline
      - name: Migration plan (no database or DDL)
        run: python backend/scripts/migration_preflight.py
      - name: Secret checks
        run: |
          python -m pip install -c backend/requirements.lock detect-secrets
          if git ls-files | rg '(^|/)(reports/|secrets/|\.env$)|\.private\.|\.(pem|key|dump)$'; then
            echo 'Private runtime artifacts must not be tracked'; exit 1
          fi
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Build non-root runtime image
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t automated-apply:ci .
          docker run --rm --entrypoint python automated-apply:ci -c 'import os; from backend.app.main import app; assert os.getuid() != 0; assert app.routes'
