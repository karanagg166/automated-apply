name: Backend CI
# Hosted CI runs only after deliberate owner authorization.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    # The full suite rebuilds isolated schemas and verifies migrations 001–012.
    # Keep a finite job limit with room for hosted-runner variance and Docker.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: profile_test_only
          POSTGRES_DB: candidate_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE_SCHEMA: job_agent
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      JOB_AGENT_API_TOKEN: ci-dummy-token-not-for-production
      PROFILE_TEST_DATABASE_URL: postgresql://postgres:profile_test_only@127.0.0.1:5432/candidate_profile_test
      HUNTER_API_KEY: ''
      APOLLO_API_KEY: ''
      SERPER_API_KEY: ''
      SIGNALHIRE_API_KEY: ''
      APIFY_API_TOKEN: ''
      GMAIL_SENDING_ENABLED: 'false'
      GMAIL_CLIENT_ID: ''
      GMAIL_CLIENT_SECRET: ''
      GMAIL_REFRESH_TOKEN: ''
      AUTOMATION_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - run: uv pip install --system -r backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: uv pip install --system ruff bandit
      - name: Core Phase 1 lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/candidate_context backend/app/ai
          backend/app/services/application_answer_service.py
          backend/tests/test_local_answer_integration.py backend/tests/test_cohere_provider.py
          backend/app/dashboard/candidate_context.py
          backend/tests/test_candidate_context*.py backend/tests/test_phase1_agy_diagnostics.py
      - name: Contact enrichment lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/contact_enrichment
          backend/app/api/v1/contact_enrichment.py
          backend/app/models/contact_enrichment.py
          backend/tests/test_contact* backend/tests/contact_enrichment_fakes.py
          backend/scripts/*contact*
      - name: Contact enrichment security scan
        run: >-
          bandit -q -r backend/app/services/contact_enrichment
          backend/app/api/v1/contact_enrichment.py
          backend/app/models/contact_enrichment.py
      - name: Phase 4A lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/integrations
          backend/app/services/outreach_drafting.py backend/app/services/saved_data.py
          backend/app/services/contact_read.py backend/app/api/v1/integrations.py
          backend/app/api/v1/outreach.py backend/app/models/connected_account.py
          backend/app/schemas/outreach.py backend/app/core/config.py backend/app/main.py
          backend/app/models/outreach.py
          backend/scripts/setup_gmail_oauth.py
          backend/tests/phase4a_fakes.py
          backend/tests/test_gmail_oauth.py backend/tests/test_gmail_token_store.py
          backend/tests/test_gmail_connection.py backend/tests/test_outreach*.py
      - name: Phase 4B lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/models/outreach_send.py backend/tests/test_gmail_send*.py
          backend/tests/test_gmail_mime.py
      - name: Phase 7 lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/dashboard backend/scripts/export_openapi.py
          backend/scripts/phase7_ui_fixture.py backend/scripts/resolve_owner_resume.py
          backend/scripts/configure_frontend_owner.py backend/tests/test_phase7_dashboard.py
          backend/app/api/v1/discovery.py
      - name: Application assistant lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/ai/optional_usage.py backend/app/ai/providers/optional.py
          backend/app/ai/output_contract.py backend/tests/test_ollama_contract.py
          backend/tests/test_optional_ai.py
          backend/app/knowledge backend/app/ai/fallback.py
          backend/app/ai/provider_factory.py backend/app/ai/providers/gemini.py
          backend/app/services/application_answer_service.py backend/app/api/v1/application_answers.py
          backend/app/schemas/candidate_profile.py backend/app/ai/schemas.py
          backend/tests/test_answer_reuse.py backend/tests/test_career_facts.py backend/tests/test_local_ai_fallback.py
          backend/tests/test_narrative_paraphrases.py
          backend/app/core/text.py backend/app/core/pinned_http.py backend/app/resume_sync/download_worker.py
          backend/app/dashboard/owner_approval.py backend/app/services/applications/intake.py
          backend/app/services/applications/multi_select.py backend/tests/test_multi_select_answers.py
          backend/app/ai/validation.py backend/app/ai/prompts.py
      - name: Backend security scan
        run: bandit -q -r backend/app
      - name: Phase 10 lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/automation backend/scripts/run_discovery_worker.py
          backend/tests/test_automation.py backend/tests/test_automation_postgres.py
          backend/scripts/verify_automation_postgres.py
      - name: Resume sync lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/scripts/run_backend_ci.py backend/tests/test_backend_ci_supervisor.py
          backend/app/resume_sync backend/scripts/sync_drive_resume.py
          backend/scripts/verify_resume_sync_migration.py
          backend/tests/test_resume_sync*.py backend/tests/test_resume_drive_download.py
      - name: Phase 5A lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/applications backend/app/api/v1/applications.py
          backend/app/schemas/applications.py backend/app/models/application_packet.py
          backend/app/repositories/application_packet.py
          backend/scripts/demo_application_preparation.py
          backend/tests/phase5a_fakes.py backend/tests/test_application_packet*.py
          backend/tests/test_application_question_mapping.py backend/tests/test_application_resume_selection.py
          backend/tests/test_application_status_tracking.py backend/tests/test_naukri_application_capabilities.py
          backend/tests/test_application_handoff.py
      - name: Phase 6A lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/services/startup_discovery backend/app/api/v1/startups.py
          backend/app/models/startup.py backend/app/services/people_discovery
          backend/app/services/job_discovery_service.py backend/app/services/job_ingestion.py
          backend/app/repositories/company.py
          backend/app/services/job_sources/apify_adapter.py backend/app/services/job_sources/direct_api.py
          backend/app/services/job_sources/registry.py
          backend/tests/startup_fakes.py backend/tests/test_live_startup_discovery.py
          backend/tests/test_startup_intelligence.py backend/tests/test_provider_connectivity.py
          backend/tests/test_startup_people_bridge.py backend/tests/test_startup_api_mcp.py
          backend/scripts/startup_discovery_demo.py
      - name: Offline startup demonstration
        run: python backend/scripts/startup_discovery_demo.py > /tmp/startup-offline.json
      - name: Python v2 lint (7 packages + Phase 6B ops)
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/browser_v2 backend/app/ai_v2 backend/app/telegram_v2 backend/app/enrichment_v2
          backend/app/mail_v2 backend/app/agent_v2 backend/app/events_v2
          backend/app/api/v1/v2 backend/app/api/v1/automation_v2.py
          backend/scripts/migrate_v2_core.py backend/scripts/cutover_v2.py backend/scripts/cleanup_legacy_v1.py
          backend/tests/test_phase6b_ops.py backend/tests/test_gmail_no_send_guardrail.py
          backend/tests/test_no_local_llm_guardrail.py
          backend/app/core/origin_policy.py backend/tests/test_v2_isolation.py
      - name: Python v2 type check (mypy 1.18.2)
        run: |
          uv pip install --system mypy==1.18.2
          mypy --ignore-missing-imports --follow-imports=silent --check-untyped-defs --warn-unused-ignores \
            --explicit-package-bases backend/app/browser_v2 backend/app/ai_v2 backend/app/telegram_v2 \
            backend/app/enrichment_v2 backend/app/mail_v2 backend/app/agent_v2 backend/app/events_v2 \
            backend/app/api/v1/automation_v2.py backend/app/api/v1/v2 backend/app/core/origin_policy.py \
            backend/scripts/cutover_v2.py backend/scripts/cleanup_legacy_v1.py
      - name: Hard guardrails (Gmail read+draft only, no local generative LLM)
        run: >-
          python -m pytest -q -p no:cacheprovider
          backend/tests/test_gmail_no_send_guardrail.py backend/tests/test_no_local_llm_guardrail.py
          backend/tests/test_architecture_standards_v2.py
      - name: Python v2 test pyramid (unit -> PG17 -> E2E)
        timeout-minutes: 10
        run: >-
          python -m pytest -q -p no:cacheprovider
          backend/tests/test_phase6b_ops.py backend/tests/test_v2_isolation.py backend/tests/test_adapters_phase6.py
          backend/tests/test_agent_v2_control_graph.py backend/tests/test_ai_v2_api.py backend/tests/test_ai_v2_pii.py
          backend/tests/test_ai_v2_pipeline.py backend/tests/test_ai_v2_router.py
          backend/tests/test_ai_v2_semantic_cache.py backend/tests/test_automation_v2_api.py
          backend/tests/test_browser_v2_answers.py backend/tests/test_browser_v2_auth.py
          backend/tests/test_browser_v2_filters.py backend/tests/test_browser_v2_hitl_requeue.py
          backend/tests/test_browser_v2_launch.py backend/tests/test_browser_v2_naukri.py
          backend/tests/test_browser_v2_postgres_store.py backend/tests/test_browser_v2_quota.py
          backend/tests/test_browser_v2_rules.py backend/tests/test_browser_v2_state.py
          backend/tests/test_browser_v2_worker.py backend/tests/test_enrichment_v2.py
          backend/tests/test_job_normalization_v2.py backend/tests/test_mail_v2.py backend/tests/test_mail_v2_reader.py
          backend/tests/test_phase6a_misc.py backend/tests/test_phase6a_v2_postgres.py
          backend/tests/test_telegram_v2_bot.py backend/tests/test_telegram_v2_postgres.py
          backend/tests/test_v2_migration_sql.py backend/tests/test_v2_live_smoke.py
          backend/tests/test_v2_full_pipeline_e2e.py backend/tests/test_v2_phase6a_browser_e2e.py
          backend/tests/test_agent_v2_control.py backend/tests/test_agent_v2_fences.py backend/tests/test_agent_v2_postgres_store.py
          backend/tests/test_agent_v2_react_graph.py backend/tests/test_agent_v2_tools.py backend/tests/test_ai_v2_multikey.py
          backend/tests/test_circuit_breaker_v2.py backend/tests/test_early_bird_notifier_v2.py backend/tests/test_env_loader_v2.py
          backend/tests/test_feed_clients_v2.py backend/tests/test_health_golive_v2.py backend/tests/test_health_phase9_v2.py
          backend/tests/test_mail_alert_links_v2.py backend/tests/test_outcomes_v2.py backend/tests/test_portal_apply_flow_v2.py
          backend/tests/test_priority_v2.py backend/tests/test_profile_autofill_v2.py backend/tests/test_profile_sync_api_v2.py
          backend/tests/test_profile_sync_cli_v2.py backend/tests/test_profile_sync_diff_v2.py backend/tests/test_profile_sync_scheduler_v2.py
          backend/tests/test_profile_sync_service_v2.py backend/tests/test_public_sources_v2.py backend/tests/test_scheduler_preemption_v2.py
          backend/tests/test_store_priority_v2.py backend/tests/test_telegram_v2_llm_routing.py backend/tests/test_telegram_v2_reliability.py
          backend/tests/test_v2_phase9_migration_sql.py backend/tests/test_watchers_v2.py backend/tests/test_worker_phase9_wiring.py
      - run: python -m compileall -q backend/app
      - name: Record isolated PostgreSQL baseline
        run: |
          mkdir -p /tmp/backend-diagnostics
          docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' '${{ job.services.postgres.id }}' > /tmp/backend-diagnostics/postgres-before.log
          docker exec '${{ job.services.postgres.id }}' psql -U postgres -d candidate_profile_test -X -c 'SELECT version(), current_database(), current_user' >> /tmp/backend-diagnostics/postgres-before.log
      - name: Full backend regression suite
        # Regular-file child output avoids inherited-pipe hangs. Keep every test
        # and the original collection order; never equate local results with CI.
        timeout-minutes: 16
        shell: bash
        run: |
          python -u backend/scripts/run_backend_ci.py --output /tmp/backend-diagnostics --seconds 900 python -u -m pytest backend/tests -v --durations=20 -o faulthandler_timeout=60 --junitxml=/tmp/backend-diagnostics/pytest.xml
      - name: Record isolated PostgreSQL final state
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p /tmp/backend-diagnostics
          timeout 10s docker logs --timestamps '${{ job.services.postgres.id }}' > /tmp/backend-diagnostics/postgres-container.log 2>&1
          timeout 10s docker exec '${{ job.services.postgres.id }}' psql -U postgres -d candidate_profile_test -X -c 'SELECT pid, datname, usename, state, wait_event_type, wait_event, backend_start, xact_start, query_start FROM pg_stat_activity' > /tmp/backend-diagnostics/postgres-after.log 2>&1
      - name: Retain backend regression diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        timeout-minutes: 2
        with:
          name: backend-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/backend-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Phase 6B operational lint
        run: >-
          ruff check --isolated --select E9,F,I
          backend/app/operations backend/app/core/config.py backend/app/core/logging.py
          backend/app/db/session.py backend/app/services/candidate_profile_service.py
          backend/app/db/safety.py backend/tests/test_database_safety.py
          backend/scripts/check_database.py
          backend/app/services/applications/platforms/public_listing.py
          backend/scripts/check_environment.py backend/scripts/migration_preflight.py
          backend/scripts/onboard_profile.py backend/scripts/run_startup_pilot.py
          backend/scripts/check_providers.py backend/scripts/smoke_test.py
          backend/scripts/check_workspace.py backend/scripts/local_public_pilot.py
          backend/scripts/public_source_smoke.py backend/scripts/validate_gemini.py
          backend/tests/test_environment_readiness.py backend/tests/test_migration_preflight.py
          backend/tests/test_profile_onboarding_readiness.py backend/tests/test_operational_health.py
          backend/tests/test_startup_pilot_operations.py
          backend/tests/test_workspace_readiness.py backend/tests/test_local_public_pilot.py
          backend/tests/test_pilot_location_evidence.py
      - name: Phase 6B offline integrated smoke
        run: python backend/scripts/smoke_test.py --mode local-offline --output /tmp/phase6b-offline
      - name: Migration plan (no database or DDL)
        run: python backend/scripts/migration_preflight.py
      - name: Secret checks
        run: |
          uv pip install --system -c backend/requirements.lock detect-secrets
          if git ls-files | grep -E '(^|/)(reports/|secrets/|\.env$)|\.private\.|\.(pem|key|dump)$'; then
            echo 'Private runtime artifacts must not be tracked'; exit 1
          fi
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Pinned Python dependency vulnerability audit
        run: |
          uv pip install --system pip-audit
          python -m pip_audit -r backend/requirements.lock --no-deps --disable-pip
      - name: Build non-root runtime image
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t automated-apply:ci .
          docker run --rm --entrypoint python automated-apply:ci -c 'import os; from backend.app.main import app; assert os.getuid() != 0; assert app.routes'
