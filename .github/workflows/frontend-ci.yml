name: Frontend CI
# Hosted CI runs only after deliberate owner authorization.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: profile_test_only # pragma: allowlist secret — fictional local test value
          POSTGRES_DB: candidate_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - run: uv pip install --system -r backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check generated API contract
        run: |
          python backend/scripts/export_openapi.py
          pnpm -C frontend api:types
          git diff --exit-code -- frontend/src/types/api.d.ts
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
        env:
          PYTHON: python
      - run: pnpm e2e:browser
        working-directory: frontend
        env:
          PYTHON: python
          PROFILE_TEST_DATABASE_URL: postgresql://postgres:profile_test_only@127.0.0.1:5432/candidate_profile_test # pragma: allowlist secret — isolated CI fixture
      - name: Build standalone non-root frontend image
        run: |
          docker build -f frontend/Dockerfile -t automated-apply-frontend:ci frontend
          docker run --rm --entrypoint node automated-apply-frontend:ci -e 'const fs = require("node:fs"); if (process.getuid() === 0 || !fs.existsSync("server.js")) process.exit(1)'
          node frontend/scripts/verify-container.mjs automated-apply-frontend:ci
      - name: Browser verification artifacts (fictional isolated fixtures only)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase7-browser-verification
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/test-results-browser/
            reports/phase7-*.png
            reports/command-execution-dashboard.png
            reports/submission-review.png
          retention-days: 7
