name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: profile_test_only # pragma: allowlist secret — fictional local test value
          POSTGRES_DB: candidate_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - name: Check generated API contract
        run: |
          python backend/scripts/export_openapi.py
          npm run api:types --prefix frontend
          git diff --exit-code -- frontend/src/types/api.d.ts
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          PYTHON: python
      - run: npm run e2e:browser
        working-directory: frontend
        env:
          PYTHON: python
          PROFILE_TEST_DATABASE_URL: postgresql://postgres:profile_test_only@127.0.0.1:5432/candidate_profile_test # pragma: allowlist secret — fictional local test value
      - name: Build standalone non-root frontend image
        run: |
          docker build -f frontend/Dockerfile -t automated-apply-frontend:ci frontend
          docker run --rm --entrypoint node automated-apply-frontend:ci -e 'const fs = require("node:fs"); if (process.getuid() === 0 || !fs.existsSync("server.js")) process.exit(1)'
          node frontend/scripts/verify-container.mjs automated-apply-frontend:ci
      - name: Browser verification artifacts (fictional isolated fixtures only)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase7-browser-verification
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/test-results-browser/
            reports/phase7-*.png
          retention-days: 7
