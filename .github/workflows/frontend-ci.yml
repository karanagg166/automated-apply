name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Check generated API contract
        run: |
          python backend/scripts/export_openapi.py
          npm run api:types --prefix frontend
          git diff --exit-code -- frontend/src/types/api.d.ts
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          PYTHON: python
      - name: Browser verification artifacts (fictional isolated fixtures only)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase7-browser-verification
          path: |
            frontend/playwright-report/
            frontend/test-results/
            reports/phase7-*.png
          retention-days: 7
