name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.15.0 --activate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check generated API contract
        run: |
          python backend/scripts/export_openapi.py
          pnpm -C frontend api:types
          git diff --exit-code -- frontend/src/types/api.d.ts
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
        env:
          PYTHON: python
      - name: Build standalone non-root frontend image
        run: |
          docker build -f frontend/Dockerfile -t automated-apply-frontend:ci frontend
          docker run --rm --entrypoint node automated-apply-frontend:ci -e 'const fs = require("node:fs"); if (process.getuid() === 0 || !fs.existsSync("server.js")) process.exit(1)'
          node frontend/scripts/verify-container.mjs automated-apply-frontend:ci
      - name: Browser verification artifacts (fictional isolated fixtures only)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase7-browser-verification
          path: |
            frontend/playwright-report/
            frontend/test-results/
            reports/phase7-*.png
          retention-days: 7
