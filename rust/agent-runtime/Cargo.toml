[package]
name = "automated-apply-agents"
default-run = "automated-apply-agents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
automated-apply-domain = { version = "0.1.0", path = "../domain" }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dotenvy = "0.15.7"
fancy-regex = "=0.20.2"
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto"] }
hmac = "=0.13.0"
idna = "1.1.0"
jsonschema = { version = "0.61.2", default-features = false }
libc = "0.2.191"
percent-encoding = "2"
regex = "1.13.1"
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sha2-hmac = { package = "sha2", version = "=0.11.1", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "tls-rustls-ring"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "signal", "net", "process", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
unicode-normalization = "0.1.26"
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
tempfile = "3"
