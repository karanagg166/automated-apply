[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = backend/tests
# Live smoke tests touch real Supabase/Brave/LLM/Telegram/IMAP: never in the default run.
# Opt in with: backend/venv/bin/python -m pytest -m live backend/tests/test_v2_live_smoke.py
addopts = -m "not live"
markers =
    live: opt-in non-destructive live checks against the owner's real accounts (pytest -m live)
