[workspace]
members = ["rust/native-host", "rust/agent-runtime", "rust/domain", "rust/document-worker", "rust/local-ipc"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep disposable local test builds small; opt into debug info only when needed.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
